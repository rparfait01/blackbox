name = "blackbox-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Principle: no telemetry. Disable Wrangler's anonymous usage metrics.
send_metrics = false

# Allowed PWA origins for CORS (comma-separated). The deployed Pages origin must
# be here so the PWA (sign-up, guardian accept) and the contact magic-link view
# can call the Worker.
[vars]
CORS_ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:4173,https://blackbox-pwa.pages.dev"
# PWA origin used to build dashboard + guardian-invite links. Set to the deployed
# Pages URL for the pilot. When empty the Worker falls back to its own origin.
PWA_ORIGIN = "https://blackbox-pwa.pages.dev"

# Secrets are NOT defined here — set them with `wrangler secret put` (see
# README.md): LINE_CHANNEL_ACCESS_TOKEN, LINE_CHANNEL_SECRET, ADMIN_TOKEN,
# MAGIC_LINK_SECRET, SESSION_SECRET, SENDGRID_API_KEY, SENDGRID_FROM_EMAIL,
# SENDGRID_FROM_NAME.

# D1 metadata database.
[[d1_databases]]
binding = "DB"
database_name = "blackbox"
database_id = "32c52326-db43-4a39-ab58-f62d7b95b9ad"
migrations_dir = "migrations"

# R2 media bucket.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "blackbox-media"