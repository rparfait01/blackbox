<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" width="2400" height="1350">
  <defs>
    <radialGradient id="glow" cx="72%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#12161f"/>
      <stop offset="55%" stop-color="#0b0e13"/>
      <stop offset="100%" stop-color="#070809"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0c10" stop-opacity="0.96"/>
      <stop offset="55%" stop-color="#0a0c10" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a0c10" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="72%" cy="34%" r="80%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#232b38" stroke-width="1.2" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="2400" height="1350" fill="url(#glow)"/>
  <rect width="2400" height="1350" fill="url(#grid)"/>
  <rect width="2400" height="1350" fill="url(#vig)"/>

  <!-- ghost mark, right side -->
  <g transform="translate(1720,560)" opacity="0.5">
    <circle cx="0" cy="0" r="300" fill="none" stroke="#2b3441" stroke-width="9"/>
    <polygon points="0,-150 130,-75 0,0 -130,-75" fill="#141a23"/>
    <polygon points="-130,-75 0,0 0,150 -130,75" fill="#0d1218"/>
    <polygon points="130,-75 0,0 0,150 130,75" fill="#0a0d12"/>
    <circle cx="0" cy="-300" r="26" fill="#e23625" opacity="0.9"/>
  </g>

  <!-- signal trace across -->
  <path d="M0,720 L900,720 L960,720 L1000,560 L1060,940 L1110,660 L1160,780 L1210,720 L2050,720 L2120,720 L2160,640 L2200,720 L2400,720"
        fill="none" stroke="#e23625" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <circle cx="2400" cy="720" r="8" fill="#e23625"/>

  <!-- left fade for text legibility -->
  <rect width="2400" height="1350" fill="url(#fade)"/>
</svg>
